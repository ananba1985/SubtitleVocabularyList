[package]
name = "subtitle-vocabulary-list"
version = "0.16.0"
description = "Offline Windows vocabulary notebook with original dialogue audio"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"

[lib]
name = "subtitle_vocabulary_list_core"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "subtitle-vocabulary-list"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
ipc-types = ["desktop", "dep:ts-rs"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-global-shortcut", "dep:windows", "dep:windows-core", "dep:libloading"]

[build-dependencies]
tauri-build = { version = "=2.7.1", optional = true , features = [] }

[dependencies]
svl-ipc-macros = { path = "ipc-macros" }
ts-rs = { version = "=12.0.1", optional = true, features = ["serde-json-impl"] }
tauri = { version = "=2.12.1", optional = true, features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
unicode-normalization = "0.1"
regex = "1"
libbitsub-core = "=1.12.1"
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png"] }
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
scraper = { version = "=0.27.0", default-features = false }
dunce = "1.0.5"
libloading = { version = "=0.7.4", optional = true }
tokio = { version = "1", features = ["rt", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-core = { version = "=0.62.2", optional = true }
windows = { version = "=0.62.2", optional = true, features = ["Win32_Foundation", "Win32_Media_Speech", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Graphics_OpenGL", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security_Cryptography", "Win32_UI_Shell"] }

[[example]]
name = "windows_probe"
required-features = ["desktop"]

[[example]]
name = "export_ipc"
required-features = ["ipc-types"]

[[example]]
name = "sync_probe"
required-features = ["desktop"]

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
